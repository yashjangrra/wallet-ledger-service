spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger_test
    username: ledger
    password: ledger
    hikari:
      maximum-pool-size: 60
      connection-init-sql: SET TIME ZONE 'Asia/Kolkata'
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
